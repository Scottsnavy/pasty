<svg xmlns="http://www.w3.org/2000/svg" style="display:none">

  <!-- REPAIR / WRENCH (cleaner geometry) -->
  <symbol id="wrench" viewBox="0 0 24 24">
    <path d="M15 3a5 5 0 0 0 6 6l-9 9a2 2 0 0 1-3-3l9-9z"
      fill="none" stroke="currentColor" stroke-width="1.8"
      stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- FLOW / DRAIN (more fluid) -->
  <symbol id="drop" viewBox="0 0 24 24">
    <path d="M12 3c-3 4-5 7-5 10a5 5 0 0 0 10 0c0-3-2-6-5-10z"
      fill="none" stroke="currentColor" stroke-width="1.8"/>
  </symbol>

  <!-- WATER HEATER (clean + centered) -->
  <symbol id="heater" viewBox="0 0 24 24">
    <rect x="7" y="3" width="10" height="18" rx="2"
      fill="none" stroke="currentColor" stroke-width="1.8"/>
    <circle cx="12" cy="12" r="2"
      fill="none" stroke="currentColor" stroke-width="1.8"/>
  </symbol>

  <!-- BATHROOM / FIXTURE (less boxy) -->
  <symbol id="toilet" viewBox="0 0 24 24">
    <path d="M8 4h8v5a4 4 0 0 1-8 0V4z"
      fill="none" stroke="currentColor" stroke-width="1.8"/>
    <path d="M6 14h12v2a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4v-2z"
      fill="none" stroke="currentColor" stroke-width="1.8"/>
  </symbol>

  <!-- PIPE (new, more industrial) -->
  <symbol id="pipe" viewBox="0 0 24 24">
    <path d="M4 12h16M9 7v10M15 7v10"
      fill="none" stroke="currentColor" stroke-width="1.8"
      stroke-linecap="round"/>
  </symbol>

</svg>
