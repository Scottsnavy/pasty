<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procedural CSS Illustration // Static Chiaroscuro</title>
    <style>
        :root {
            /* Color Palette & Ambient Light Maps */
            --bg-main: #111116;
            --canvas-bg: #1e1e2f;
            --canvas-border: #3a3a50;
            --text-muted: #5a5a7a;
            --text-bright: #8a8ab0;
            
            /* Layer Ingredients with directional lighting built-in */
            --bun-top-light: #f39c12;
            --bun-top-dark: #cc7a00;
            --bun-bottom-light: #ba6f00;
            --bun-bottom-dark: #945800;
            
            --tomato-light: #ff5555;
            --tomato-dark: #e62e2e;
            --lettuce-light: #2ecc71;
            --lettuce-dark: #27ae60;
            --cheese-light: #f1c40f;
            --cheese-dark: #d4ac0d;
            
            --patty-light: #6e4629;
            --patty-dark: #462b19;
            --patty-shadow: #2e1c10;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-main);
            color: #fff;
            font-family: monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Strict 4:6 Aspect Ratio Container */
        .canvas {
            width: 400px;
            height: 600px;
            background: var(--canvas-bg);
            border: 3px solid var(--canvas-border);
            border-radius: 20px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
        }

        /* Fixed Geometric Burger Stack */
        .burger-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: auto;
            gap: 4px; /* Tight, structurally sound static assembly */
        }

        /* Base Structural Component Layer Engine */
        .layer {
            display: block;
            min-height: 20px;
            border-radius: 8px;
            position: relative;
        }

        /* 1. TOP BUN: Spherical Top-Down Light Arc */
        .bun-top {
            width: 260px;
            height: 76px;
            background: linear-gradient(180deg, var(--bun-top-light) 0%, var(--bun-top-dark) 100%);
            border-radius: 120px 120px 14px 14px;
            /* Inset shadow creates the internal global illumination rim highlight */
            box-shadow: 
                inset 0 6px 12px rgba(255, 255, 255, 0.3),
                0 6px 12px rgba(0, 0, 0, 0.4);
            z-index: 6;
        }

        /* Procedural Seeds casting minor ambient shadows */
        .bun-top::before {
            content: "•  •  •  •  •";
            position: absolute;
            top: 22px;
            left: 0;
            width: 100%;
            text-align: center;
            color: #fff;
            font-size: 24px;
            letter-spacing: 15px;
            opacity: 0.65;
            text-shadow: 0 2px 2px rgba(0, 0, 0, 0.4);
        }

        /* 2. TOMATOES: Dual Cylindrical Falloff */
        .tomatoes {
            width: 250px;
            height: 26px;
            display: flex;
            gap: 12px;
            z-index: 5;
        }
        .tomato {
            flex: 1;
            background: linear-gradient(180deg, var(--tomato-light) 0%, var(--tomato-dark) 100%);
            border-radius: 8px;
            height: 100%;
            box-shadow: 
                inset 0 3px 6px rgba(255, 255, 255, 0.2),
                0 6px 10px rgba(0, 0, 0, 0.35);
        }

        /* 3. LETTUCE: Angular Edge Occlusion */
        .lettuce {
            width: 272px;
            height: 18px;
            background: linear-gradient(180deg, var(--lettuce-light) 0%, var(--lettuce-dark) 100%);
            border-radius: 20px 8px 20px 8px;
            box-shadow: 
                inset 0 3px 4px rgba(255, 255, 255, 0.2),
                0 5px 8px rgba(0, 0, 0, 0.4);
            z-index: 4;
        }

        /* 4. CHEESE: Radiating Melt and Creep Lighting */
        .cheese {
            width: 266px;
            height: 14px;
            background: linear-gradient(180deg, var(--cheese-light) 0%, var(--cheese-dark) 100%);
            border-radius: 4px;
            box-shadow: inset 0 2px 3px rgba(255, 255, 255, 0.4);
            z-index: 3;
        }
        /* Melt Drop Extrusion with custom shadow casting */
        .cheese::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 35px;
            width: 24px;
            height: 22px;
            background: var(--cheese-dark);
            border-radius: 0 0 10px 10px;
            box-shadow: 2px 3px 6px rgba(0, 0, 0, 0.3);
        }

        /* 5. PATTY: Deep Coarse Texture and Core Umbra Shadow */
        .patty {
            width: 262px;
            height: 52px;
            background: linear-gradient(180deg, var(--patty-light) 0%, var(--patty-dark) 100%);
            border-radius: 16px;
            border-bottom: 6px solid var(--patty-shadow);
            /* Casts a heavy, wide ambient drop shadow onto the lower bun */
            box-shadow: 
                inset 0 4px 6px rgba(255, 255, 255, 0.1),
                0 8px 16px rgba(0, 0, 0, 0.6);
            z-index: 2;
        }

        /* 6. BOTTOM BUN: Base Terminated Light Falloff */
        .bun-bottom {
            width: 256px;
            height: 44px;
            background: linear-gradient(180deg, var(--bun-bottom-light) 0%, var(--bun-bottom-dark) 100%);
            border-radius: 4px 4px 40px 40px;
            box-shadow: 
                inset 0 3px 6px rgba(255, 255, 255, 0.15),
                0 10px 20px rgba(0, 0, 0, 0.5);
            z-index: 1;
        }

        /* UI Overlay Elements */
        .ui-text {
            position: absolute;
            color: var(--text-muted);
            font-size: 11px;
            letter-spacing: 2px;
        }
        .ui-top-left  { top: 25px; left: 25px; }
        .ui-top-right { top: 25px; right: 25px; }
        .ui-bottom    { bottom: 30px; color: var(--text-bright); font-weight: bold; }
    </style>
</head>
<body>

    <div class="canvas">
        <div class="ui-text ui-top-left">SPEC // 04-06.AR</div>
        <div class="ui-text ui-top-right">RENDER: STATIC_CHIAROSCURO</div>

        <div class="burger-container">
            <div class="layer bun-top"></div>
            <div class="layer tomatoes">
                <div class="tomato"></div>
                <div class="tomato"></div>
            </div>
            <div class="layer lettuce"></div>
            <div class="layer cheese"></div>
            <div class="layer patty"></div>
            <div class="layer bun-bottom"></div>
        </div>

        <div class="ui-text ui-bottom">STATIC SYSTEM // ZERO_COMPUTE</div>
    </div>

</body>
</html>
