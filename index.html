<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative Code Cheeseburger // Loop</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #111116;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: monospace;
        }

        /* Strict 4:6 Aspect Ratio Container */
        .canvas {
            width: 400px;
            height: 600px;
            background: #1e1e2f;
            border: 3px solid #3a3a50;
            border-radius: 20px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
        }

        /* Burger Stack Container with Infinite Loop Animation */
        .burger-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: auto;
            /* 4s loop, smooth acceleration/deceleration, infinite repeat, reverses direction on alternate cycles */
            animation: explode 4s ease-in-out infinite alternate;
        }

        /* CSS Keyframes for the Loop */
        @keyframes explode {
            0% {
                gap: 6px; /* Compact assembled state */
            }
            100% {
                gap: 28px; /* Exploded schematic view */
            }
        }

        /* Base Ingredient Styling */
        .layer {
            display: block;
            min-height: 20px;
            border-radius: 6px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
        }

        .bun-top {
            width: 260px;
            height: 70px;
            background: #e68a00;
            border-radius: 120px 120px 10px 10px;
            position: relative;
        }

        /* Procedural CSS Sesame Seeds */
        .bun-top::before {
            content: "•  •  •  •  •";
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            color: #fff;
            font-size: 24px;
            letter-spacing: 15px;
            opacity: 0.7;
        }

        .tomatoes {
            width: 250px;
            height: 25px;
            display: flex;
            gap: 10px;
        }

        .tomato {
            flex: 1;
            background: #ff4444;
            border-radius: 8px;
            height: 100%;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
        }

        .lettuce {
            width: 270px;
            height: 20px;
            background: #2ecc71;
            border-radius: 20px 5px 20px 5px;
        }

        .cheese {
            width: 265px;
            height: 15px;
            background: #f1c40f;
            position: relative;
            border-radius: 4px;
        }

        /* Cheese Melt Extrusion */
        .cheese::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 30px;
            width: 25px;
            height: 20px;
            background: #f1c40f;
            border-radius: 0 0 10px 10px;
        }

        .patty {
            width: 260px;
            height: 50px;
            background: #5c3a21;
            border-radius: 15px;
            border-bottom: 6px solid #442a18;
        }

        .bun-bottom {
            width: 255px;
            height: 45px;
            background: #d37e00;
            border-radius: 6px 6px 40px 40px;
        }

        /* UI Overlay Elements */
        .ui-text {
            position: absolute;
            color: #5a5a7a;
            font-size: 11px;
            letter-spacing: 2px;
        }
        .ui-top-left  { top: 25px; left: 25px; }
        .ui-top-right { top: 25px; right: 25px; }
        .ui-bottom    { bottom: 30px; color: #8a8ab0; font-weight: bold; }
    </style>
</head>
<body>

    <div class="canvas">
        <div class="ui-text ui-top-left">SPEC // 04-06.AR</div>
        <div class="ui-text ui-top-right">RENDER: LOOP_ACTIVE</div>

        <div class="burger-container">
            <div class="layer bun-top"></div>
            <div class="tomatoes">
                <div class="tomato"></div>
                <div class="tomato"></div>
            </div>
            <div class="layer lettuce"></div>
            <div class="layer cheese"></div>
            <div class="layer patty"></div>
            <div class="layer bun-bottom"></div>
        </div>

        <div class="ui-text ui-bottom">LOOPING SCHEMA // ANIM_ACTIVE</div>
    </div>

</body>
</html>
