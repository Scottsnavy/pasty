<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Vector Symbol Matrix</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #0a0a0c;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: system-ui, sans-serif;
        }
        .canvas-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 4 / 6;
            padding: 20px;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
            background: #111115;
            border: 1px solid #222227;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="canvas-container">
    <canvas id="matrixCanvas"></canvas>
</div>

<script>
const canvas = document.getElementById('matrixCanvas');
const ctx = canvas.getContext('2d');

// Set high-DPI internal resolution for crisp rendering
function initCanvas() {
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * window.devicePixelRatio;
    canvas.height = rect.height * window.devicePixelRatio;
    ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
}

// Procedural texture generator to mimic high-contrast wave/silhouette forms without external images
function drawProceduralData(tempCtx, w, h) {
    tempCtx.fillStyle = '#000';
    tempCtx.fillRect(0, 0, w, h);
    
    // Base gradient representing sky/background depth
    let skyGrad = tempCtx.createLinearGradient(0, 0, 0, h);
    skyGrad.addColorStop(0, '#222');
    skyGrad.addColorStop(0.4, '#000');
    tempCtx.fillStyle = skyGrad;
    tempCtx.fillRect(0, 0, w, h);

    // Deep structural wave swoop curves
    tempCtx.fillStyle = '#fff';
    tempCtx.beginPath();
    tempCtx.moveTo(0, h * 0.2);
    tempCtx.bezierCurveTo(w * 0.4, h * 0.2, w * 0.3, h * 0.8, w, h * 0.9);
    tempCtx.lineTo(w, h);
    tempCtx.lineTo(0, h);
    tempCtx.closePath();
    tempCtx.fill();

    // Surfer silhouette block
    tempCtx.fillStyle = '#000';
    tempCtx.beginPath();
    tempCtx.ellipse(w * 0.55, h * 0.5, 12, 30, Math.PI / 4, 0, Math.PI * 2);
    tempCtx.fill();
    
    // Surfboard element
    tempCtx.fillStyle = '#fff';
    tempCtx.beginPath();
    tempCtx.ellipse(w * 0.53, h * 0.53, 6, 40, Math.PI / 3, 0, Math.PI * 2);
    tempCtx.fill();
}

function renderMatrix() {
    const rect = canvas.getBoundingClientRect();
    const w = rect.width;
    const h = rect.height;
    
    // Create an offscreen buffer to read pixel data from the procedural shape
    const offscreen = document.createElement('canvas');
    offscreen.width = 120; // Internal grid resolution (X axis)
    offscreen.height = 180; // Internal grid resolution (Y axis - 4:6 ratio)
    const oCtx = offscreen.getContext('2d');
    
    drawProceduralData(oCtx, offscreen.width, offscreen.height);
    const imgData = oCtx.getImageData(0, 0, offscreen.width, offscreen.height);
    
    // Clear display canvas
    ctx.fillStyle = '#0a0a0c';
    ctx.fillRect(0, 0, w, h);
    
    const cellW = w / offscreen.width;
    const cellH = h / offscreen.height;
    
    // Loop through buffer data and map to high-fidelity primitives
    for (let y = 0; y < offscreen.height; y++) {
        for (let x = 0; x < offscreen.width; x++) {
            const i = (x + y * offscreen.width) * 4;
            const r = imgData.data[i];
            const g = imgData.data[i+1];
            const b = imgData.data[i+2];
            const brightness = (r + g + b) / 3;
            
            // Calculate screen coordinates
            const posX = x * cellW + cellW / 2;
            const posY = y * cellH + cellH / 2;
            
            if (brightness > 200) {
                // Highlights: Render dense geometric blocks or bold ticks
                ctx.fillStyle = '#ff6b00'; // High-impact accent color
                ctx.fillRect(posX - cellW * 0.4, posY - cellH * 0.4, cellW * 0.8, cellH * 0.8);
            } else if (brightness > 90) {
                // Midtones: Clean vector cross-hatches or points
                ctx.strokeStyle = '#44444a';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(posX - cellW * 0.3, posY);
                ctx.lineTo(posX + cellW * 0.3, posY);
                ctx.stroke();
            } else if (brightness > 30) {
                // Low-density shadows: Micro-dots
                ctx.fillStyle = '#222227';
                ctx.beginPath();
                ctx.arc(posX, posY, cellW * 0.15, 0, Math.PI * 2);
                ctx.fill();
            }
            // Absolute blacks drop completely, leaving clean background negative space
        }
    }
}

// Lifecycle controllers
initCanvas();
renderMatrix();

window.addEventListener('resize', () => {
    initCanvas();
    renderMatrix();
});
</script>

</body>
</html>
